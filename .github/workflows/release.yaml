name: Release

on:
  push:
    branches:
      - main
    tags:
      - v*
      - '*.*.*'
  workflow_dispatch:

jobs:
  release:
    uses: pschmitt/android-app-ci/.github/workflows/release.yaml@main
    with:
      app-display-name: "AUGH!"
      application-id: dev.pschmitt.augh
      artifact-label: augh
      # AUGH! has no CI signing keystore configured (no CI_KEYSTORE_* secrets) - falls back to
      # build.gradle.kts's own (debug-key) release signing config, same as before migration.
      enable-release-signing: false
      # No per-ABI splits - a single universal app-debug.apk/app-release.apk.
      release-apk-paths: app/build/outputs/apk/release/app-release.apk
      debug-apk-paths: app/build/outputs/apk/debug/app-debug.apk
      # build.gradle.kts doesn't read GIT_REVISION into BuildConfig.
      verify-git-revision: false
    secrets: inherit
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
