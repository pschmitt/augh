name: Lint

# Dispatchable on demand in addition to its normal push/PR gating. Delegates to
# pschmitt/android-app-ci's reusable lint workflow (ktfmt + Android Lint, with the ktfmt
# auto-fix-PR behavior) - see that repo's README for what it does. AUGH! has no
# app/lint-baseline.xml, so that check is skipped here.
on:
  push:
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '.github/workflows/lint.yaml'
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '.github/workflows/lint.yaml'
  workflow_dispatch:

jobs:
  lint:
    uses: pschmitt/android-app-ci/.github/workflows/lint.yaml@main
    with:
      lint-baseline-path: ''
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
