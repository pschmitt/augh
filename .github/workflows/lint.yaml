name: Lint

# Dispatchable on demand in addition to its normal push/PR gating. The ktfmt and Android Lint
# checks run as independent parallel jobs so a failure in one doesn't hide or block the other -
# both report in a single run instead of needing a fix-push-fail-fix-push cycle per issue. When
# ktfmtCheck fails - on any trigger - the `ktfmt` job also uploads a `ktfmt-diff-patch` artifact
# containing exactly what `./gradlew ktfmtFormat` would change.
on:
  push:
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '.github/workflows/lint.yaml'
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '.github/workflows/lint.yaml'
  workflow_dispatch:

jobs:
  ktfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11'
      - uses: gradle/actions/setup-gradle@v6
      - id: ktfmt_check
        run: ./gradlew ktfmtCheck
      - if: ${{ failure() && steps.ktfmt_check.outcome == 'failure' }}
        run: |
          ./gradlew ktfmtFormat
          git diff > /tmp/ktfmt.patch
      - if: ${{ failure() && steps.ktfmt_check.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ktfmt-diff-patch
          path: /tmp/ktfmt.patch
          if-no-files-found: error

  android-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew lintDebug
