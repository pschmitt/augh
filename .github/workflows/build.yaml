name: Build

on:
  push:
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.11"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ktfmtCheck testDebugUnitTest assembleDebug
