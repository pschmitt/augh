name: Build

on:
  push:
  pull_request:

jobs:
  build:
    uses: pschmitt/android-app-ci/.github/workflows/build.yaml@main
    with:
      # AUGH! doesn't produce per-ABI split debug APKs (no splits.abi config), just a single
      # universal app-debug.apk - the shared workflow's per-ABI upload steps don't fit, and this
      # matches augh's pre-migration build.yaml, which didn't upload a debug artifact at all.
      upload-artifacts: false
