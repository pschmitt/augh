name: Screenshots

# Screenshot capture is intentionally manual, mirroring the sibling nyetbox/jollyfin projects'
# own Screenshots workflow. It drives the same fastlane screengrab pipeline as `just screenshots`
# (see docs/screenshots.md - deliberately left untouched by this workflow) but on disposable
# GitHub-hosted emulators instead of the wired Zenfone 10 or a local AVD, then uploads the
# reviewed images as a build artifact (or, with open_pr, commits them straight to a PR for review
# there instead).
on:
  workflow_dispatch:
    inputs:
      open_pr:
        description: Open a PR with the captured screenshots committed, instead of only uploading a build artifact
        type: boolean
        default: false

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: phone
            profile: pixel_2
            folder: phoneScreenshots
          - device_type: sevenInch
            profile: Nexus 7
            folder: sevenInchScreenshots
          - device_type: tenInch
            profile: medium_tablet
            folder: tenInchScreenshots
    name: Capture ${{ matrix.device_type }} screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
      - name: Install fastlane
        run: gem install fastlane --no-document

      # Build before the emulator starts, not while it's running: screengrab only installs/drives
      # prebuilt APKs over adb (see fastlane/Screengrabfile), and compiling concurrently with a
      # booted emulator starves it of CPU until it drops off adb entirely - confirmed the hard way
      # in the sibling nyetbox/jollyfin projects' own screenshot CI.
      - name: Build the debug and androidTest APKs
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/

      # GitHub-hosted runners ship /dev/kvm but don't grant the job user access to it, so the
      # emulator silently falls back to software-only emulation and takes ~15+ minutes to boot.
      # This grants real KVM access. (A controlled test in the sibling nyetbox project's own
      # android-e2e.yaml ruled KVM out as a cause of emulator flakiness there, so it's not worth
      # trading away for iteration speed here either.)
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots in a ${{ matrix.device_type }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: ${{ matrix.profile }}
          target: google_apis
          force-avd-creation: true
          emulator-boot-timeout: 1800
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          # android-emulator-runner runs each line of this script as its own separate `sh -c`
          # process, so a shell variable set on one line is gone by the next - the serial capture,
          # install, and the fastlane invocation that needs the serial must all stay on one line.
          # `install -g` grants every runtime permission declared in the manifest at install time,
          # so none of them can pop a system dialog on top of the app and block the test from
          # finding any hierarchy. force-avd-creation plus -no-snapshot above mean this emulator is
          # always fresh, so there's no prior app state to reset first (unlike the reused local AVD
          # in `just screenshots-tablet`, which also does a pm clear before granting).
          # Retries the reinstall+capture (not the whole job) up to twice, confirmed necessary by a
          # real run where the tablet profiles' first UI wait raced a still-cold app process even
          # after ci/android-emulator-wait.sh's OS-level readiness checks passed - cheap (~30-60s)
          # to redo versus the full rebuild+reboot, and each attempt starts from a clean reinstall.
          script: |
            bash ci/android-emulator-wait.sh
            attempt=0; until [ "$attempt" -ge 2 ]; do attempt=$((attempt + 1)); serial="$(adb devices | awk '$2 == "device" { print $1; exit }')"; if [ -n "$serial" ] && adb -s "$serial" install -r -g -t dist/app-debug.apk && SCREENGRAB_DEVICE_TYPE=${{ matrix.device_type }} SCREENGRAB_SPECIFIC_DEVICE="$serial" fastlane screenshots; then exit 0; fi; echo "Attempt $attempt/2 failed" >&2; sleep 5; done; exit 1

      - name: Upload screenshot artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: augh-${{ matrix.device_type }}-screenshots-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            fastlane/metadata/android/en-US/images/${{ matrix.folder }}/
            app/build/reports/androidTests/

  open-pr:
    name: Open PR with updated screenshots
    needs: capture
    if: ${{ !cancelled() && !failure() && inputs.open_pr }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # GITHUB_TOKEN can never push a branch whose commit range touches .github/workflows/* -
      # main's own history (including this workflow file's own past fix-up commits) always will,
      # so every branch built from it trips that restriction regardless of what this job's own
      # commit changes ("refusing to allow a GitHub App to create or update workflow ... without
      # `workflows` permission" - not a scope grantable via the `permissions:` key above). Needs a
      # fine-grained PAT (scoped to just this repo: Contents + Pull requests + Workflows, all read
      # & write) in the WORKFLOW_PUSH_TOKEN repo secret - falls back to the default token when that
      # secret isn't set, which reproduces the same failure so it's obvious what's missing rather
      # than silently no-op-ing.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.WORKFLOW_PUSH_TOKEN || github.token }}

      - name: Download phone screenshots
        uses: actions/download-artifact@v8
        with:
          name: augh-phone-screenshots-${{ github.run_id }}
          path: fastlane/metadata/android/en-US/images/phoneScreenshots

      - name: Download sevenInch screenshots
        uses: actions/download-artifact@v8
        with:
          name: augh-sevenInch-screenshots-${{ github.run_id }}
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots

      - name: Download tenInch screenshots
        uses: actions/download-artifact@v8
        with:
          name: augh-tenInch-screenshots-${{ github.run_id }}
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots

      # Each device-type artifact was uploaded alongside app/build/reports/androidTests/ (see the
      # capture job), so it unpacks with the actual .pngs nested some levels deep rather than
      # directly in the download path. Find them regardless of exact depth and drop everything
      # else before committing.
      - name: Flatten downloaded artifacts to just the screenshots
        run: |
          for device_type in phone sevenInch tenInch; do
            dir="fastlane/metadata/android/en-US/images/${device_type}Screenshots"
            find "$dir" -mindepth 2 -iname '*.png' -exec mv {} "$dir/" \;
            find "$dir" -mindepth 1 -type d -exec rm -rf {} +
          done

      # README.md's gallery uses the phone bucket's editor/present captures under stable
      # filenames, so those don't drift into a second, separately-maintained set of screenshots -
      # see docs/screenshots.md. screengrab always appends a timestamp to each capture (e.g.
      # 01_editor_1785838133428.png), so match on the numeric prefix rather than an exact name.
      - name: Sync README screenshots from the phone bucket
        run: |
          src="fastlane/metadata/android/en-US/images/phoneScreenshots"
          declare -A readme_images=(
            [01_editor]="docs/images/editor.png"
            [02_present]="docs/images/present.png"
          )
          for prefix in "${!readme_images[@]}"; do
            match="$(find "$src" -iname "${prefix}_[0-9]*.png" | head -n1)"
            test -n "$match" || { echo "No capture found for $prefix" >&2; exit 1; }
            cp "$match" "${readme_images[$prefix]}"
          done

      # fastlane/metadata/ is tracked (see .gitignore) so this same PR carries both the README
      # gallery and the actual Play Store listing images - merging it is what publishes the
      # latter, via play-store-images.yaml.
      - name: Check for changes
        id: diff
        run: |
          git add docs/images fastlane/metadata/android/en-US/images
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A stable branch name (not keyed by run_id) plus a force-push means repeated dispatches
      # update the same PR in place instead of piling up a new one per run.
      - name: Commit and force-push
        if: ${{ steps.diff.outputs.changed == 'true' }}
        id: commit
        run: |
          branch="screenshots/update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "chore: update Play Store and README screenshots (phone, 7in, 10in tablet)"
          git push --force origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The PR diff is just-renamed binary PNGs, next to unreviewable without opening every file -
      # embed each one inline instead, addressed at this exact commit (not the branch, which gets
      # force-pushed again on the next run) so a comment's images never silently change under a
      # reviewer after the fact.
      - name: Build inline image gallery
        if: ${{ steps.diff.outputs.changed == 'true' }}
        id: gallery
        run: |
          sha="${{ steps.commit.outputs.sha }}"
          gallery_file="$(mktemp)"
          for device_type in phone sevenInch tenInch; do
            dir="fastlane/metadata/android/en-US/images/${device_type}Screenshots"
            shopt -s nullglob
            files=("$dir"/*.png)
            [ ${#files[@]} -eq 0 ] && continue
            {
              echo "<details open>"
              echo "<summary><strong>${device_type}</strong> (${#files[@]} images)</summary>"
              echo
              for f in "${files[@]}"; do
                name="$(basename "$f")"
                url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${sha}/${f}"
                printf '<img src="%s" width="200" alt="%s" title="%s">\n' "$url" "$name" "$name"
              done
              echo
              echo "</details>"
              echo
            } >> "$gallery_file"
          done
          echo "path=$gallery_file" >> "$GITHUB_OUTPUT"

      - name: Open or update the PR
        if: ${{ steps.diff.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PUSH_TOKEN || github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          GALLERY_FILE: ${{ steps.gallery.outputs.path }}
        run: |
          existing_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          body_file="$(mktemp)"
          if [ -n "$existing_pr" ]; then
            {
              echo "Updated with fresh screenshots from run ${{ github.run_id }}."
              echo
              cat "$GALLERY_FILE"
            } > "$body_file"
            gh pr comment "$existing_pr" --body-file "$body_file"
          else
            {
              echo "Automated screenshot refresh from the \`Screenshots\` workflow (run ${{ github.run_id }}), including README.md's gallery (phone bucket). Review the images below before merging. Re-running this workflow with \`open_pr\` updates this same PR instead of opening a new one."
              echo
              echo "Merging this PR uploads the updated images to the Play Console listing automatically (see \`play-store-images.yaml\`)."
              echo
              cat "$GALLERY_FILE"
            } > "$body_file"
            gh pr create --title "Update screenshots" --body-file "$body_file" --head "$BRANCH" --base "${{ github.ref_name }}"
          fi

